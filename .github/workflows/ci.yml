name: Qualidade
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: clara
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: clara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clara -d clara_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clara:ci_local_only@127.0.0.1:5432/clara_test
      TEST_DATABASE_URL: postgresql://clara:ci_local_only@127.0.0.1:5432/clara_test
      APP_ORIGIN: http://localhost:5173
      MAIL_MODE: local
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
