# Demonstration only. Review current free-plan availability and expiry before deployment.
# No paid fallback. Database credentials are injected by Render, never stored in Git.
services:
  - type: web
    name: clara
    runtime: node
    plan: free
    branch: feat/clara-core-and-planning
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:cloud
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_MODE
        value: preview
      - key: MAIL_MODE
        value: disabled
      - key: DATABASE_URL
        fromDatabase:
          name: clara-db
          property: connectionString
databases:
  - name: clara-db
    plan: free
    ipAllowList: []
